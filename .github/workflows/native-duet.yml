name: Native V6 baseline and duet source validation
on:
  workflow_dispatch:
  push:
    branches: [feature/v6-native-duet-choreography]
    paths:
      - native-v6/migration/**
      - choreography-v7/migration/**
      - scripts/materialize_native.py
      - .github/workflows/native-duet.yml
permissions:
  contents: write
concurrency:
  group: native-duet-${{ github.ref }}
  cancel-in-progress: false
jobs:
  materialize-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Restore checked readable native sources
        run: |
          python3 scripts/materialize_native.py
          python3 scripts/materialize_native.py --check
      - name: Compile and test accepted V6 and new duet
        run: |
          set -o pipefail
          mkdir -p validation
          make -C native-v6/engine -j2 all checks finish-checks continuation-checks 2>&1 | tee validation/v6-tests.log
          make -C choreography-v7/engine -j2 all checks finish-checks continuation-checks choreography-checks 2>&1 | tee validation/duet-tests.log
          python3 -m py_compile choreography-v7/*.py native-v6/*.py
      - name: Commit readable sources without altering historical revisions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native-v6 choreography-v7
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize exact V6 baseline and tested native duet source'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-v6-duet-validation
          path: validation/
          if-no-files-found: ignore
